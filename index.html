<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Mobile-optimized viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />

    <!-- SEO -->
    <meta name="description" content="Northern Armor builds high-performance digital tools. Our Gym Tracker features AI-powered programs, progress tracking, XP rewards, and detailed stats." />
    <meta name="keywords" content="northern armor, gym tracker, workout tracker, fitness app, strength training, weight lifting, exercise log, AI workout, fitness progress" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Northern Armor - Engineered for Performance" />
    <meta property="og:description" content="High-performance digital tools. AI-powered workout programs, progress tracking, XP rewards, and detailed stats." />
    <meta property="og:site_name" content="Northern Armor" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Northern Armor - Engineered for Performance" />
    <meta name="twitter:description" content="High-performance digital tools. AI-powered workout programs, progress tracking, XP rewards, and detailed stats." />

    <!-- PWA & Mobile App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Northern Armor" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Performance hints -->
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Northern Armor - Engineered for Performance</title>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Northern Armor Gym Tracker",
      "description": "High-performance fitness tools with AI-powered workout programs, progress tracking, XP rewards, and detailed stats.",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web, iOS, Android",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "AI-generated workout programs",
        "Workout logging and history",
        "Progress tracking and statistics",
        "XP and achievement system",
        "Custom workout builder",
        "Offline support"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
